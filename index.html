<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaCash - Indique um Amigo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
 
        .presentation-container {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
 
        .slide {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #f0f5ff 100%);
            position: relative;
            overflow: hidden;
        }
 
        /* Elemento decorativo de fundo */
        .slide::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 82, 204, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
 
        .slide::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
 
        .slide-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
        }
 
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #0052cc;
            letter-spacing: -1px;
            margin-bottom: 40px;
        }
 
        h1 {
            font-size: 56px;
            font-weight: 800;
            color: #0052cc;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
 
        .highlight {
            color: #00d966;
            font-weight: 800;
        }
 
        .subtitle {
            font-size: 24px;
            color: #5a6c7d;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }
 
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #0052cc 0%, #0066ff 100%);
            color: white;
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 82, 204, 0.3);
            text-decoration: none;
        }
 
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 82, 204, 0.4);
        }
 
        .cta-button:active {
            transform: translateY(0);
        }
 
        /* Responsivo */
        @media (max-width: 768px) {
            h1 {
                font-size: 40px;
            }
 
            .subtitle {
                font-size: 18px;
            }
 
            .slide {
                padding: 40px 30px;
            }
 
            .logo {
                font-size: 24px;
                margin-bottom: 30px;
            }
        }
 
        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
            }
 
            .subtitle {
                font-size: 16px;
            }
 
            .slide {
                padding: 30px 20px;
            }
 
            .cta-button {
                padding: 14px 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        <div class="slide">
            <div class="slide-content">
                <div class="logo">Arena<strong>Cash</strong></div>
                <h1>Indique um amigo<br>e ganhe <span class="highlight">R$ 50</span></h1>
                <p class="subtitle">Compartilhe a melhor forma de investir com quem você ama e receba uma recompensa para cada indicação bem-sucedida.</p>
                <button class="cta-button">Saiba mais</button>
            </div>
        </div>
    </div>
</body>
</html>
